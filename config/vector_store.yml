backend: qdrant
url: http://localhost:6333
grpc_port: 6334
prefer_grpc: true
qdrant_timeout_seconds: 60
collection_alias: rag_active
collection_prefix: rag
data_path: data
manifest_path: storage/rag/index_manifest.json
bm25_artifact_path: storage/rag/bm25_documents.json
evaluation_cases_path: app/evaluation/retrieval_cases.json
evaluation_report_path: storage/rag/retrieval_evaluation_report.json
preflight_report_path: storage/rag/index_preflight_report.json

k: 6
candidate_k: 15
min_relevance_score: 0.0
query_history_turns: 3
max_subqueries: 2
query_planner_enabled: true
reranker_enabled: true
reranker_candidate_k: 12
reranker_base_score_weight: 0.7
# 外部知识图谱的原始三元组可补长尾概念，但信息密度低于人工审核专题资料；
# 仅在最终排序阶段做小幅软惩罚，不影响召回或过滤结果。
source_quality_penalties:
  "external/fitkg-cn/": 0.08
metadata_tag_boost_enabled: true
metadata_tag_boost_weight: 0.15
max_context_chars: 6000
max_chars_per_evidence: 1200
allow_knowledge_file_type: ["txt", "md", "pdf"]
chunk_size: 500
chunk_overlap: 80
parent_chunk_size: 1200
parent_chunk_overlap: 160
batch_size: 32
near_duplicate_hamming_distance: 3
max_tags: 4
# 发布前数据质量门槛：预检与正式索引构建共用，避免空数据或异常缩小的数据集被发布。
min_source_count: 1
min_chunk_count: 1
separators: ["\n\n", "\n", "。", "！", "？", ".", "!", "?", " ", ""]

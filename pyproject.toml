[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitagent"
version = "2.0.0"
description = "多Agent个性化运动教练"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn==0.47.0",
    "starlette==1.0.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "SQLAlchemy==2.0.49",
    "PyMySQL==1.2.0",
    "python-jose==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.29",
    "dashscope==1.25.18",
    "langchain==1.3.1",
    "langchain-core==1.4.0",
    "langchain-community==0.4.1",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.0",
    "qdrant-client==1.18.0",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "sse-starlette==3.4.4",
    "pypdf==6.11.0",
    "python-magic==0.4.27; sys_platform != 'win32'",
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
    "pdf2image==1.17.0",
    "Pillow==11.3.0",
    "rank-bm25==0.2.2",
    "slowapi==0.1.9",
    "alembic==1.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.9.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

<text x="309.0" y="643.1" font-size="17" text-anchor="middle" fill="#1e40af">fitagent_knowledge</text>
<text x="309.0" y="665.8" font-size="14" text-anchor="middle" fill="#374151">只读集合，points 可健康检查</text>

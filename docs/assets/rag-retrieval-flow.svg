<text x="94.0" y="780.5" font-size="17" text-anchor="start" fill="#e8590c">关键参数与契约</text>
<text x="94.0" y="821.9" font-size="14" text-anchor="start" fill="#374151">candidate_k / rerank_candidate_k = 30</text>
<text x="94.0" y="851.9" font-size="14" text-anchor="start" fill="#374151">最终 k = 6，单次请求只嵌入查询一次</text>
<text x="94.0" y="881.9" font-size="14" text-anchor="start" fill="#374151">max_context_chars = 6000「单条 1200」</text>
<text x="94.0" y="911.9" font-size="14" text-anchor="start" fill="#374151">evidence_id = source_id#chunk_id</text>
<text x="94.0" y="941.9" font-size="14" text-anchor="start" fill="#374151">重排失败统一降级为『知识库检索暂不可用』</text>
